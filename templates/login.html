<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <link href="fonts.googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="snowflakes" aria-hidden="true">
        {% for i in range(60) %}<div class="snowflake">•</div>{% endfor %}
    </div>

    <div class="login-container">
        <div class="login-card">
            <h1>Вход</h1>
            <p class="subtitle">Введите данные для доступа</p>
            
            <form method="POST">
                <div class="input-group">
                    <input type="text" name="username" placeholder="Логин" required>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Пароль" required>
                </div>
                <button type="submit" class="btn-primary">Подтвердить</button>
            </form>
            
            <a href="{{ url_for('index') }}" class="logout-link">Вернуться на главную</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/snow.js') }}"></script>
</body>
</html>
