<!DOCTYPE html>
<html lang="ru">
<head>

</head>

            <div class="info-grid">

                    <span class="label">Name</span>

                </div>
                <div class="info-item">
                    <span class="label">Name</span>
                    <span class="value">Name</span>

            </div>

    </div>
    <script src="{{ url_for('static', filename='js/snow.js') }}"></script>

</html>
